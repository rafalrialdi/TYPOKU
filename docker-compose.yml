services:
  backend:
    build: ./backend
    container_name: typoku-backend
    env_file:
      - ./backend/.env
    ports:
      # Dibuka agar browser bisa memanggil API langsung (tanpa reverse proxy),
      # sekaligus berguna untuk ngrok saat menguji webhook Midtrans.
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Dibakar ke bundle saat build. Mengubah nilai ini wajib
        # `docker compose build frontend` (restart saja tidak cukup).
        VITE_API_BASE_URL: http://localhost:8000
        # Client ID bersifat publik; harus sama dengan GOOGLE_CLIENT_ID di backend.
        VITE_GOOGLE_CLIENT_ID: 1041685307920-is0n95v1jpncfv600md4bg9br67ncq81.apps.googleusercontent.com
    container_name: typoku-frontend
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
